services:
  db:
    image: postgres:16-alpine
    container_name: mpm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mpm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: src/MPM.Api/Dockerfile
    container_name: mpm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - MP_TICKET=${MP_TICKET}
      - Storage__Provider=local
      - Storage__LocalPath=/app/uploads
      # Gemini vía Vertex AI + ADC (020-migracion-gemini-adc) — ya no API key.
      # GOOGLE_APPLICATION_CREDENTIALS apunta al archivo de ADC del desarrollador, montado
      # como volumen abajo. Generar una vez con: gcloud auth application-default login
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-tivit-cu010}
      - Vertex__Region=${VERTEX_REGION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/adc-credentials.json
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Telegram__BotUsername=${TELEGRAM_BOT_USERNAME:-CU010_bot}
      - Telegram__WebhookSecret=${TELEGRAM_WEBHOOK_SECRET:-}
      # Scraper
      - MP_RUT=${MP_RUT:-}
      - MP_PASSWORD=${MP_PASSWORD:-}
      - SCRAPER_ENABLED=${SCRAPER_ENABLED:-false}
      - Scraper__Enabled=${SCRAPER_ENABLED:-false}
      - Scraper__IntervalHours=${SCRAPER_INTERVAL_HOURS:-12}
      - Scraper__ScriptPath=/app/tools/agente-mp.js
      # Extracción de documentos vía HTTP directo (016-extraccion-documentos-api)
      - Extraccion__Modo=${EXTRACCION_MODO:-solo_navegador}
      - Extraccion__SesionTtlHoras=${EXTRACCION_SESION_TTL_HORAS:-6}
      - Extraccion__ExportarSesionScriptPath=/app/tools/exportar-sesion.js
      - MP_ANALISIS_IA=${MP_ANALISIS_IA:-true}
      - MP_HEADLESS=true
      - MP_FECHA_DESDE=${MP_FECHA_DESDE:-01-01-2025}
      - API_BASE_URL=http://localhost:80
      # Monitor de aclaraciones
      - MONITOR_ENABLED=${MONITOR_ENABLED:-true}
      - MONITOR_INTERVAL_MINUTES=${MONITOR_INTERVAL_MINUTES:-30}
      - Monitor__Enabled=${MONITOR_ENABLED:-true}
      - Monitor__IntervalMinutes=${MONITOR_INTERVAL_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5001:80"
    volumes:
      - api_uploads:/app/uploads
      - ${ADC_CREDENTIALS_PATH}:/app/adc-credentials.json:ro

  web:
    build:
      context: ./src/mpm-web
      dockerfile: Dockerfile
    container_name: mpm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8181:80"

volumes:
  postgres_data:
  redis_data:
  api_uploads:
