services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
    container_name: mpm-cloudsql-proxy
    restart: unless-stopped
    # Usa las credenciales de la Service Account adjunta a la VM (ADC) — sin archivos de key.
    # roles/cloudsql.client debe estar otorgado a esa Service Account.
    command: ["--address=0.0.0.0", "--port=5432", "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mpm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: src/MPM.Api/Dockerfile
    container_name: mpm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__PostgreSQL=Host=cloudsql-proxy;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - MP_TICKET=${MP_TICKET}
      - Storage__Provider=gcs
      - Storage__Bucket=tivit-cu010-mpm-adjuntos
      - GOOGLE_CLOUD_PROJECT=tivit-cu010
      - Gemini__ApiKey=${GEMINI_API_KEY}
      # Scraper
      - MP_RUT=${MP_RUT:-}
      - MP_PASSWORD=${MP_PASSWORD:-}
      - SCRAPER_ENABLED=${SCRAPER_ENABLED:-false}
      - Scraper__Enabled=${SCRAPER_ENABLED:-false}
      - Scraper__IntervalHours=${SCRAPER_INTERVAL_HOURS:-12}
      - Scraper__ScriptPath=/app/tools/agente-mp.js
      - MP_ANALISIS_IA=${MP_ANALISIS_IA:-true}
      - MP_HEADLESS=true
      - MP_FECHA_DESDE=${MP_FECHA_DESDE:-01-01-2025}
      - API_BASE_URL=http://localhost:80
      # 037-C observabilidad LLM y OTel (prod: OTLP hacia Cloud Trace tivit-cu010)
      - Otlp__Enabled=${OTLP_ENABLED:-true}
      - Otlp__Endpoint=${OTLP_ENDPOINT:-https://otel-collector.tivit-cu010:4317}
      - Langfuse__Enabled=${LANGFUSE_ENABLED:-false}
      # Monitor de aclaraciones
      - MONITOR_ENABLED=${MONITOR_ENABLED:-true}
      - MONITOR_INTERVAL_MINUTES=${MONITOR_INTERVAL_MINUTES:-30}
      - Monitor__Enabled=${MONITOR_ENABLED:-true}
      - Monitor__IntervalMinutes=${MONITOR_INTERVAL_MINUTES:-30}
    depends_on:
      cloudsql-proxy:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./src/mpm-web
      dockerfile: Dockerfile
    container_name: mpm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Sin dominio propio todavía: se expone directo en 80 sobre la IP externa de la VM (FR-006 con dominio queda para cuando exista uno).
      - "80:80"

volumes:
  redis_data:
