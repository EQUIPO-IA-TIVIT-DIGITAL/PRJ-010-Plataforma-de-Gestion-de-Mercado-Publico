<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    background: radial-gradient(circle at 50% 40%, #1a1a1f 0%, #0b0b0e 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .logo {
    width: 110px;
    height: 110px;
    border-radius: 22px;
    filter: drop-shadow(0 0 60px rgba(242, 0, 36, 0.45));
  }
  .tag {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(242, 0, 36, 0.6);
    border-radius: 999px;
    color: #ff5a5a;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
  }
  .title {
    color: #ffffff;
    font-size: 58px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin: 0;
    text-align: center;
    max-width: 1100px;
    line-height: 1.15;
  }
  .brand {
    color: #d8d8dc;
    font-size: 28px;
    font-weight: 500;
    margin: 0;
    text-align: center;
    letter-spacing: 1px;
  }
  .tagline {
    color: #8a8a92;
    font-size: 24px;
    font-weight: 400;
    margin-top: 6px;
    text-align: center;
    max-width: 900px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon_tivit.svg" alt="TIVIT" />
    <span class="tag">PRJ-010</span>
    <div>
      <p class="title">Plataforma de Gestión de Mercado Público</p>
      <p class="brand">TIVIT</p>
    </div>
    <p class="tagline">Sincronización, análisis con inteligencia artificial y alertas<br/>inteligentes para licitaciones públicas — Demo interna</p>
  </div>
</body>
</html>
