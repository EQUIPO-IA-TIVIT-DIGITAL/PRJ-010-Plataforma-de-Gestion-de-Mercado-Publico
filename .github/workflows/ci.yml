name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mpm
          POSTGRES_PASSWORD: mpm_password
          POSTGRES_DB: mpm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Redis con password (los tests la hardcodean)
        # services: no acepta command: se levanta a mano con --requirepass.
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine redis-server --requirepass redis_password
          for i in $(seq 1 30); do docker exec ci-redis redis-cli -a redis_password ping 2>/dev/null | grep -q PONG && break; sleep 2; done
      - name: Migrar BD fresca (espejo de DatabaseInitializer)
        run: |
          docker run --rm --network host \
            -v "$PWD/.github/scripts/migrate.sh:/migrate.sh:ro" \
            -v "$PWD/src/MPM.Api/Database/Scripts:/scripts:ro" \
            -e PGPASSWORD=mpm_password \
            postgres:16-alpine sh /migrate.sh /scripts
      - name: Seed mínimo CI (sustancia para tests de datos)
        run: |
          docker run --rm --network host \
            -v "$PWD/.github/scripts/seed-ci.sql:/seed-ci.sql:ro" \
            -e PGPASSWORD=mpm_password \
            postgres:16-alpine psql -h localhost -p 5433 -U mpm -d mpm -v ON_ERROR_STOP=1 -f /seed-ci.sql
      - name: Restore
        run: dotnet restore MPM.sln
      - name: Build
        run: dotnet build MPM.sln --no-restore --nologo -v minimal
      - name: Test por proyecto (serial, BD fresca compartida)
        # Las suites de integración corren contra Postgres (services) y Redis
        # (paso anterior) en localhost, mismo patrón que local. Secuencial para
        # evitar interferencia entre proyectos sobre conteos globales.
        run: |
          for p in tests/*/; do
            dotnet test "$p" --no-build --nologo -v minimal || exit 1
          done
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mpm-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/mpm-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    env:
      DB_USER: mpm
      DB_PASSWORD: mpm_password
      DB_NAME: mpm
      REDIS_PASSWORD: redis_password
      JWT_SECRET: CI-DUMMY-JWT-SECRET-MIN-32-CHARS-LONG-0123456789
      JWT_ISSUER: MPM
      JWT_AUDIENCE: MPM
      ASPNETCORE_ENVIRONMENT: Development
      SCRAPER_ENABLED: "false"
      ADC_CREDENTIALS_PATH: /dev/null
      # El config de Playwright usa http://web:PORT cuando CI=true; en el runner
      # ese hostname no resuelve (los tests corren en el host, no en un contenedor).
      BASE_URL: http://localhost:8181
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:8181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/mpm-web/package-lock.json
      - name: Install web deps
        run: npm ci
        working-directory: src/mpm-web
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: src/mpm-web
      - name: Generar .env CI (el compose lo exige vía env_file; efímero del runner)
        run: |
          cat > .env <<'EOF'
          DB_USER=mpm
          DB_PASSWORD=mpm_password
          DB_NAME=mpm
          REDIS_PASSWORD=redis_password
          JWT_SECRET=CI-DUMMY-JWT-SECRET-MIN-32-CHARS-LONG-0123456789
          JWT_ISSUER=MPM
          JWT_AUDIENCE=MPM
          ASPNETCORE_ENVIRONMENT=Development
          SCRAPER_ENABLED=false
          ADC_CREDENTIALS_PATH=/dev/null
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8181
          EOF
      - name: Levantar stack (build)
        run: docker compose up -d --build
      - name: Esperar API sana (migra en arranque)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5001/health && break
            sleep 5
          done
          curl -sf http://localhost:5001/health
      - name: Seed mínimo (sustancia para tests de datos)
        run: cat .github/scripts/seed-ci.sql | docker compose exec -T db psql -U mpm -d mpm
      - name: Playwright E2E
        run: npx playwright test --reporter=github
        working-directory: src/mpm-web
      - name: Subir evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/mpm-web/test-results
      - name: Bajar stack
        if: always()
        run: docker compose down
